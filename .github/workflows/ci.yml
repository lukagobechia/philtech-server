name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Integration tests start Postgres with Testcontainers (Docker is available on GitHub runners).
      - run: npm test
      - run: npm run build
      - run: docker build -t philtech-api:${{ github.sha }} .

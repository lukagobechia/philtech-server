services:
  postgres:
    container_name: philtech-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: express_api
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d express_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for CVs (dev only; use S3/R2 in production).
  # Create the bucket once with: npm run storage:init
  s3:
    container_name: philtech-s3
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=64 -volume.max=20
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3_data:/data

  # Catches all outgoing email in dev; web UI on http://localhost:8025.
  mailpit:
    container_name: philtech-mailpit
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build: .
    profiles: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/express_api
      S3_ENDPOINT: http://s3:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  postgres_data:
  s3_data:
